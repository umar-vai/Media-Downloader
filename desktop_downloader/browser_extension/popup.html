<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Media Downloader Capture</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div>
      <h1>Media Downloader</h1>
      <p>Browser Capture</p>
    </div>
    <span id="status" class="badge">Not paired</span>
  </header>

  <section class="pair">
    <label for="pairing">Pairing code</label>
    <div class="row">
      <input id="pairing" placeholder="38471|your-token">
      <button id="savePairing">Pair</button>
    </div>
    <div class="row secondary">
      <button id="testConnection">Test connection</button>
      <span id="connectionText"></span>
    </div>
  </section>

  <section class="toolbar">
    <div>
      <strong id="count">0 streams</strong>
      <small>Current tab</small>
    </div>
    <button id="clearTab" class="ghost">Clear</button>
  </section>

  <main id="captures">
    <div class="empty">Play a video to detect media streams.</div>
  </main>

  <footer>
    Captures MP4/WebM, HLS and DASH requests. DRM-protected streams are not bypassed.
  </footer>

  <script src="popup.js"></script>
</body>
</html>
