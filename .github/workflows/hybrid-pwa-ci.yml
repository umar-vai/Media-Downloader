name: Hybrid PWA CI

on:
  push:
    paths:
      - "hybrid_core/**"
      - "media_core/**"
      - "web_pwa/**"
      - "desktop_downloader/media_sources.py"
      - "desktop_downloader/browser_resolver.py"
      - ".github/workflows/hybrid-pwa-ci.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install local-core dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r hybrid_core/requirements.txt

      - name: Compile local core
        shell: pwsh
        run: |
          python -m py_compile media_core/network.py
          python -m py_compile media_core/sources.py
          python -m py_compile media_core/browser_resolver.py
          python -m py_compile media_core/engine.py
          python -m py_compile media_core/editor.py
          python -m py_compile hybrid_core/engine.py
          python -m py_compile hybrid_core/agent_control.py
          python -m py_compile hybrid_core/windows_startup.py
          python -m py_compile hybrid_core/update_helper.py
          python -m py_compile hybrid_core/agent.py
          python -m py_compile hybrid_core/paths.py
          python -m py_compile hybrid_core/settings_store.py
          python -m py_compile hybrid_core/editor_library.py
          python -m py_compile hybrid_core/core_updater.py
          python -m py_compile hybrid_core/state_store.py
          python -m py_compile hybrid_core/logging_setup.py
          python -m py_compile hybrid_core/version.py
          python -m py_compile hybrid_core/jobs.py
          python -m py_compile hybrid_core/server.py
          python -m py_compile hybrid_core/launcher.py

      - name: Run unit tests
        shell: pwsh
        run: |
          python -m unittest discover -s media_core/tests -p "test_*.py" -v
          python -m unittest discover -s hybrid_core/tests -p "test_*.py" -v

      - name: Validate PWA shell
        shell: pwsh
        run: |
          python -c "from pathlib import Path; required=['index.html','app.js','styles.css','manifest.webmanifest','sw.js','icon.svg']; missing=[x for x in required if not (Path('web_pwa')/x).exists()]; assert not missing, missing"
          node --check web_pwa/app.js
