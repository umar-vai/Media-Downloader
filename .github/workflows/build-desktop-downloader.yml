name: Build Media Downloader

on:
  push:
    branches: [main]
    tags:
      - 'v*'
    paths:
      - 'desktop_downloader/**'
      - 'media_core/**'
      - '.github/workflows/build-desktop-downloader.yml'
  pull_request:
    paths:
      - 'desktop_downloader/**'
      - 'media_core/**'
      - '.github/workflows/build-desktop-downloader.yml'
  workflow_dispatch:

concurrency:
  group: media-downloader-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop_downloader/requirements.txt

      - name: Validate Python and updater tests
        shell: pwsh
        run: |
          python -m py_compile media_core/network.py
          python -m py_compile media_core/sources.py
          python -m py_compile media_core/browser_resolver.py
          python -m py_compile media_core/engine.py
          python -m py_compile desktop_downloader/app.py
          python -m py_compile desktop_downloader/app_logging.py
          python -m py_compile desktop_downloader/download_queue.py
          python -m py_compile desktop_downloader/browser_resolver.py
          python -m py_compile desktop_downloader/diagnostics_window.py
          python -m py_compile desktop_downloader/history_store.py
          python -m py_compile desktop_downloader/history_window.py
          python -m py_compile desktop_downloader/editor_history.py
          python -m py_compile desktop_downloader/install_mode.py
          python -m py_compile desktop_downloader/media_editor.py
          python -m py_compile desktop_downloader/media_player.py
          python -m py_compile desktop_downloader/media_editor_engine.py
          python -m py_compile desktop_downloader/media_editor_widgets.py
          python -m py_compile desktop_downloader/launcher.py
          python -m py_compile desktop_downloader/media_sources.py
          python -m py_compile desktop_downloader/network_proxy.py
          python -m py_compile desktop_downloader/self_test.py
          python -m py_compile desktop_downloader/settings_window.py
          python -m py_compile desktop_downloader/shared_engine.py
          python -m py_compile desktop_downloader/update_manager.py
          python -m py_compile desktop_downloader/updater.py
          python -m py_compile desktop_downloader/version.py
          python -c "import sys; sys.path.insert(0, 'desktop_downloader'); from version import APP_VERSION; parts=APP_VERSION.split('.'); assert len(parts)==3 and all(part.isdigit() for part in parts), APP_VERSION; print('APP_VERSION=' + APP_VERSION)"
          python -m unittest discover -s desktop_downloader/tests -v
          python desktop_downloader/tests/smoke_editor_export.py
          python -c "import sys; sys.path.insert(0, 'desktop_downloader'); from yt_dlp import YoutubeDL; from yt_dlp.networking.impersonate import ImpersonateTarget; y=YoutubeDL({'quiet': True}); assert y._impersonate_target_available(ImpersonateTarget('chrome')), 'Chrome impersonation target unavailable'"

      - name: Verify release tag matches APP_VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart("v")
          $appVersion = python -c "import sys; sys.path.insert(0, 'desktop_downloader'); from version import APP_VERSION; print(APP_VERSION)"
          if ($tagVersion -ne $appVersion) {
            throw "Tag version $tagVersion does not match APP_VERSION $appVersion"
          }

      - name: Install bundled mpv playback engine
        shell: pwsh
        run: |
          choco install mpvio.install --version 0.41.0 -y --no-progress
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $candidates = Get-ChildItem "$env:ChocolateyInstall\lib" -Recurse -File -Filter "mpv.exe" -ErrorAction SilentlyContinue |
            Where-Object { $_.Length -gt 1000000 } |
            Sort-Object Length -Descending
          if (-not $candidates) {
            throw "Could not locate the real mpv.exe installed by Chocolatey."
          }
          Copy-Item $candidates[0].FullName "dist\mpv.exe" -Force
          Write-Host "Bundling mpv from $($candidates[0].FullName)"
          & "dist\mpv.exe" --version

      - name: Smoke test bundled mpv
        shell: pwsh
        run: |
          python desktop_downloader/tests/smoke_mpv.py dist/mpv.exe

      - name: Run source runtime self-test
        shell: pwsh
        run: |
          $env:MEDIA_DOWNLOADER_MPV = (Resolve-Path "dist\mpv.exe").Path
          python desktop_downloader/self_test.py --report dist/source-self-test.json
          Get-Content dist/source-self-test.json

      - name: Build updater EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name MediaDownloaderUpdater `
            desktop_downloader/updater.py

      - name: Build portable Media Downloader EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name MediaDownloader `
            --collect-all yt_dlp `
            --collect-all curl_cffi `
            --collect-all imageio_ffmpeg `
            --collect-all websocket `
            --collect-all customtkinter `
            --collect-all PIL `
            --add-binary "dist/MediaDownloaderUpdater.exe;." `
            --add-binary "dist/mpv.exe;." `
            desktop_downloader/launcher.py

      - name: Run portable packaged self-test
        shell: pwsh
        run: |
          $report = (Join-Path $PWD "dist\portable-self-test.json")
          $process = Start-Process -FilePath (Resolve-Path "dist\MediaDownloader.exe").Path `
            -ArgumentList @("--self-test", "--report", $report) `
            -Wait -PassThru
          if (-not (Test-Path $report)) {
            throw "Portable runtime self-test did not produce a report."
          }
          Get-Content $report
          if ($process.ExitCode -ne 0) {
            throw "Portable runtime self-test failed with exit code $($process.ExitCode)."
          }
          $payload = Get-Content $report -Raw | ConvertFrom-Json
          if ($payload.install_mode -ne "portable") {
            throw "Expected portable install mode, got '$($payload.install_mode)'."
          }

      - name: Build installed onedir package
        shell: pwsh
        run: |
          $updater = (Resolve-Path "dist\MediaDownloaderUpdater.exe").Path
          $mpv = (Resolve-Path "dist\mpv.exe").Path
          pyinstaller --noconfirm --clean --onedir --windowed `
            --name MediaDownloader `
            --distpath "dist/installed" `
            --workpath "build/installed" `
            --specpath "build/installed" `
            --collect-all yt_dlp `
            --collect-all curl_cffi `
            --collect-all imageio_ffmpeg `
            --collect-all customtkinter `
            --collect-all PIL `
            --add-binary "$updater;." `
            --add-binary "$mpv;." `
            desktop_downloader/launcher.py

      - name: Run onedir packaged self-test
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist\installed\MediaDownloader\MediaDownloader.exe").Path
          $report = (Join-Path $PWD "dist\onedir-self-test.json")
          $process = Start-Process -FilePath $exe -ArgumentList @("--self-test", "--report", $report) -Wait -PassThru
          if (-not (Test-Path $report)) {
            throw "Onedir runtime self-test did not produce a report."
          }
          Get-Content $report
          if ($process.ExitCode -ne 0) {
            throw "Onedir runtime self-test failed with exit code $($process.ExitCode)."
          }

      - name: Package extraction-safe portable ZIP
        shell: pwsh
        run: |
          $portableRoot = "dist\installed\MediaDownloader"
          $portableZip = "dist\MediaDownloaderPortable.zip"
          if (-not (Test-Path $portableRoot)) {
            throw "Installed onedir package is missing."
          }
          if (Test-Path $portableZip) {
            Remove-Item $portableZip -Force
          }
          Compress-Archive -Path "$portableRoot\*" -DestinationPath $portableZip -CompressionLevel Optimal
          if (-not (Test-Path $portableZip)) {
            throw "Portable ZIP was not created."
          }
          $extractRoot = Join-Path $env:RUNNER_TEMP "MediaDownloaderPortableSmoke"
          if (Test-Path $extractRoot) {
            Remove-Item $extractRoot -Recurse -Force
          }
          Expand-Archive -Path $portableZip -DestinationPath $extractRoot -Force
          $portableExe = Join-Path $extractRoot "MediaDownloader.exe"
          if (-not (Test-Path $portableExe)) {
            throw "Portable ZIP does not contain MediaDownloader.exe."
          }
          $report = Join-Path $env:RUNNER_TEMP "portable-zip-self-test.json"
          $test = Start-Process -FilePath $portableExe -ArgumentList @("--self-test", "--report", $report) -Wait -PassThru
          if ($test.ExitCode -ne 0 -or -not (Test-Path $report)) {
            throw "Portable ZIP runtime self-test failed."
          }
          Get-Content $report

      - name: Build Windows installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $isccPath = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*" -Recurse -File -Filter "ISCC.exe" -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $isccPath) {
            $isccCommand = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($isccCommand) {
              $isccPath = $isccCommand.Source
            }
          }
          if (-not $isccPath) {
            throw "Inno Setup compiler was not found."
          }
          Write-Host "Using Inno Setup compiler: $isccPath"
          $appVersion = python -c "import sys; sys.path.insert(0, 'desktop_downloader'); from version import APP_VERSION; print(APP_VERSION)"
          $sourceDir = (Resolve-Path "dist\installed\MediaDownloader").Path
          $outputDir = (Resolve-Path "dist").Path
          & $isccPath "/DAppVersion=$appVersion" "/DSourceDir=$sourceDir" "/DOutputDir=$outputDir" "desktop_downloader\installer\MediaDownloader.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup build failed."
          }
          if (-not (Test-Path "dist\MediaDownloaderSetup.exe")) {
            throw "Installer output is missing."
          }

      - name: Smoke test installer install and uninstall
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "MediaDownloaderInstalledTest"
          if (Test-Path $installDir) {
            Remove-Item $installDir -Recurse -Force
          }
          $setup = (Resolve-Path "dist\MediaDownloaderSetup.exe").Path
          $install = Start-Process -FilePath $setup `
            -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDir") `
            -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "Installer smoke install failed with exit code $($install.ExitCode)."
          }

          $installedExe = Join-Path $installDir "MediaDownloader.exe"
          if (-not (Test-Path $installedExe)) {
            throw "Installed MediaDownloader.exe is missing."
          }
          $report = Join-Path $env:RUNNER_TEMP "installed-self-test.json"
          $test = Start-Process -FilePath $installedExe -ArgumentList @("--self-test", "--report", $report) -Wait -PassThru
          if ($test.ExitCode -ne 0 -or -not (Test-Path $report)) {
            throw "Installed runtime self-test failed."
          }
          Get-Content $report
          $payload = Get-Content $report -Raw | ConvertFrom-Json
          if ($payload.install_mode -ne "installer") {
            throw "Expected installer mode, got '$($payload.install_mode)'."
          }

          $uninstaller = Join-Path $installDir "unins000.exe"
          if (-not (Test-Path $uninstaller)) {
            throw "Installer did not create an uninstaller."
          }
          $uninstall = Start-Process -FilePath $uninstaller `
            -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") `
            -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) {
            throw "Installer smoke uninstall failed with exit code $($uninstall.ExitCode)."
          }

      - name: Generate SHA-256 checksums and compatibility alias
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist/MediaDownloader.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  MediaDownloader.exe" | Out-File "dist/MediaDownloader.exe.sha256" -Encoding ascii
          $legacy = "Team" + "Fahad" + "YouTubeDownloader.exe"
          Copy-Item "dist/MediaDownloader.exe" (Join-Path "dist" $legacy)
          "$hash  $legacy" | Out-File (Join-Path "dist" ($legacy + ".sha256")) -Encoding ascii

          $setupHash = (Get-FileHash "dist/MediaDownloaderSetup.exe" -Algorithm SHA256).Hash.ToLower()
          "$setupHash  MediaDownloaderSetup.exe" | Out-File "dist/MediaDownloaderSetup.exe.sha256" -Encoding ascii

          $portableZipHash = (Get-FileHash "dist/MediaDownloaderPortable.zip" -Algorithm SHA256).Hash.ToLower()
          "$portableZipHash  MediaDownloaderPortable.zip" | Out-File "dist/MediaDownloaderPortable.zip.sha256" -Encoding ascii

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaDownloader-Windows
          path: |
            dist/MediaDownloader.exe
            dist/MediaDownloader.exe.sha256
            dist/MediaDownloaderSetup.exe
            dist/MediaDownloaderSetup.exe.sha256
            dist/MediaDownloaderPortable.zip
            dist/MediaDownloaderPortable.zip.sha256
            dist/TeamFahadYouTubeDownloader.exe
            dist/TeamFahadYouTubeDownloader.exe.sha256
            dist/portable-self-test.json
            dist/onedir-self-test.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish version release from main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $appVersion = python -c "import sys; sys.path.insert(0, 'desktop_downloader'); from version import APP_VERSION; print(APP_VERSION)"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not read APP_VERSION."
          }
          $appVersion = "$appVersion".Trim()
          $versionParts = $appVersion.Split(".")
          if ($versionParts.Count -ne 3) {
            throw "APP_VERSION must be semantic x.y.z, got '$appVersion'."
          }
          foreach ($part in $versionParts) {
            $parsed = 0
            if (-not [int]::TryParse($part, [ref]$parsed)) {
              throw "APP_VERSION must be semantic x.y.z, got '$appVersion'."
            }
          }
          $tag = "v$appVersion"
          $repo = "${{ github.repository }}"
          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; skipping."
            exit 0
          }
          gh release create $tag `
            "dist/MediaDownloader.exe" `
            "dist/MediaDownloader.exe.sha256" `
            "dist/MediaDownloaderSetup.exe" `
            "dist/MediaDownloaderSetup.exe.sha256" `
            "dist/MediaDownloaderPortable.zip" `
            "dist/MediaDownloaderPortable.zip.sha256" `
            "dist/TeamFahadYouTubeDownloader.exe" `
            "dist/TeamFahadYouTubeDownloader.exe.sha256" `
            --repo $repo --target "${{ github.sha }}" --title "Media Downloader $tag" --generate-notes

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/MediaDownloader.exe
            dist/MediaDownloader.exe.sha256
            dist/MediaDownloaderSetup.exe
            dist/MediaDownloaderSetup.exe.sha256
            dist/MediaDownloaderPortable.zip
            dist/MediaDownloaderPortable.zip.sha256
            dist/TeamFahadYouTubeDownloader.exe
            dist/TeamFahadYouTubeDownloader.exe.sha256
