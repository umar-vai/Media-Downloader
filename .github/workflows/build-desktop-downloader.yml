name: Build Media Downloader

on:
  push:
    branches: [main]
    tags:
      - 'v*'
    paths:
      - 'desktop_downloader/**'
      - '.github/workflows/build-desktop-downloader.yml'
      - 'scripts/hotfix_v234_facebook_fallback.py'
  pull_request:
    paths:
      - 'desktop_downloader/**'
      - '.github/workflows/build-desktop-downloader.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply v2.3.4 Facebook fallback hotfix
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Release v2.3.4 Facebook fallback hotfix'
        shell: pwsh
        run: python scripts/hotfix_v234_facebook_fallback.py

      - name: Commit v2.3.4 source
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Release v2.3.4 Facebook fallback hotfix'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          Get-ChildItem -Path . -Directory -Filter __pycache__ -Recurse | Remove-Item -Recurse -Force
          git add desktop_downloader
          git commit -m "Add Facebook connection fallbacks v2.3.4"
          git push origin main

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop_downloader/requirements.txt

      - name: Validate Python and updater tests
        shell: pwsh
        run: |
          python -m py_compile desktop_downloader/app.py
          python -m py_compile desktop_downloader/media_sources.py
          python -m py_compile desktop_downloader/update_manager.py
          python -m py_compile desktop_downloader/updater.py
          python -m unittest discover -s desktop_downloader/tests -v
          python -c "import sys; sys.path.insert(0, 'desktop_downloader'); from yt_dlp import YoutubeDL; from yt_dlp.networking.impersonate import ImpersonateTarget; y=YoutubeDL({'quiet': True}); assert y._impersonate_target_available(ImpersonateTarget('chrome')), 'Chrome impersonation target unavailable'"

      - name: Verify release tag matches APP_VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart("v")
          $appVersion = python -c "import sys; sys.path.insert(0, 'desktop_downloader'); from version import APP_VERSION; print(APP_VERSION)"
          if ($tagVersion -ne $appVersion) {
            throw "Tag version $tagVersion does not match APP_VERSION $appVersion"
          }

      - name: Build updater EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name MediaDownloaderUpdater `
            desktop_downloader/updater.py

      - name: Build Media Downloader EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name MediaDownloader `
            --collect-all yt_dlp `
            --collect-all curl_cffi `
            --collect-all imageio_ffmpeg `
            --collect-all customtkinter `
            --collect-all PIL `
            --add-binary "dist/MediaDownloaderUpdater.exe;." `
            desktop_downloader/app.py

      - name: Generate SHA-256 checksums and compatibility alias
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist/MediaDownloader.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  MediaDownloader.exe" | Out-File "dist/MediaDownloader.exe.sha256" -Encoding ascii
          $legacy = "Team" + "Fahad" + "YouTubeDownloader.exe"
          Copy-Item "dist/MediaDownloader.exe" (Join-Path "dist" $legacy)
          "$hash  $legacy" | Out-File (Join-Path "dist" ($legacy + ".sha256")) -Encoding ascii

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaDownloader-Windows
          path: |
            dist/MediaDownloader.exe
            dist/MediaDownloader.exe.sha256
            dist/TeamFahadYouTubeDownloader.exe
            dist/TeamFahadYouTubeDownloader.exe.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Create v2.3.4 tag once
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Release v2.3.4 Facebook fallback hotfix'
        shell: pwsh
        run: |
          git tag v2.3.4
          git push origin v2.3.4

      - name: Publish v2.3.4 once
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Release v2.3.4 Facebook fallback hotfix'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.3.4
          name: Media Downloader v2.3.4
          body: |
            Facebook connection compatibility hotfix.

            - Converts Facebook Reel/video IDs to the mobile watch endpoint as the first fallback path.
            - Forces IPv4 for Facebook fallback attempts to avoid problematic IPv6/edge routes.
            - Retries Facebook through both standard yt-dlp TLS and Chrome/curl_cffi transport.
            - Keeps Instagram on its working standard transport.
            - Clears stale previous-media preview data before each new analysis.
            - Keeps the resilient Facebook/Instagram format fallback from v2.3.2.
          files: |
            dist/MediaDownloader.exe
            dist/MediaDownloader.exe.sha256
            dist/TeamFahadYouTubeDownloader.exe
            dist/TeamFahadYouTubeDownloader.exe.sha256

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/MediaDownloader.exe
            dist/MediaDownloader.exe.sha256
            dist/TeamFahadYouTubeDownloader.exe
            dist/TeamFahadYouTubeDownloader.exe.sha256
